_BASE_: "../../../../configs/Base-RCNN-FPN.yaml"
MODEL:
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  # WEIGHTS: "/home/s4861264/detectron2/projects/LoTSS-GRG-detect/output/grg_mask_rcnn_b2s/model_0054999.pth"
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  ROI_HEADS:
    NAME: "B2SROIHeads"
    BATCH_SIZE_PER_IMAGE: 256
    NUM_CLASSES: 2  # MCS and SCS classes
    SCORE_THRESH_TEST: 0.5  # Adjust based on validation performance
  ROI_MASK_HEAD:
    NAME: "WeightedMaskRCNNConvUpsampleHead"
    POOLER_RESOLUTION: 28  # Increase mask resolution from default 14
    MCS_MASK_WEIGHT: 3.0  # Give more weight to MCS class in the mask head loss
  ROI_BOX_HEAD:
    MCS_CLS_WEIGHT: 3.0  # Give more weight to MCS class in the class head loss
  # We load precomputed proposals in custom mapper (from NPZ files)
  # So LOAD_PROPOSALS should be False (it expects pickle files)
  LOAD_PROPOSALS: False
  PROPOSAL_GENERATOR:
    NAME: "PrecomputedProposals"
DATASETS:
  TRAIN: ("b2s_train",)
  TEST: ("b2s_val",)
  PRECOMPUTED_PROPOSAL_TOPK_TRAIN: 10000
  PRECOMPUTED_PROPOSAL_TOPK_TEST: 10000
DATALOADER:
  NUM_WORKERS: 4  # Adjust based on your CPU cores
  SAMPLER_TRAIN: "RepeatFactorTrainingSampler"
  REPEAT_THRESHOLD: 0.3  # images with category frequency below 30% get repeated
TRAINER:
  NAME: "GRGTrainer"
SOLVER:
  IMS_PER_BATCH: 16  # Adjust based on your GPU memory
  BASE_LR: 0.001
  STEPS: (690000, 920000) # 60% and 80% of the total iterations # Adjust based on your dataset size and desired schedule
  MAX_ITER: 1150000
  CHECKPOINT_PERIOD: 50000
  WARMUP_ITERS: 1000
INPUT:
  MIN_SIZE_TRAIN: (300,)  # Match your image size
  MAX_SIZE_TRAIN: 300
  MIN_SIZE_TEST: 300
  MAX_SIZE_TEST: 300
  MASK_FORMAT: "bitmask"  # Use "bitmask" for RLE format annotations
TEST:
  EVAL_PERIOD: 20000  # Evaluate every 20000 iterations
  EVALUATOR: "B2SMaskedRCNNEvaluator"
OUTPUT_DIR: "/home/aurelsa/projects/detectron2/projects/LoTSS-GRG-detect/output/mask_rcnn_b2s_rgz_v2"


# V2:
# - Added mcs_weight parameter to the mask head and loss function, and set it to 3.0 to give more weight to the MCS class in the loss.
# - Also use the same weight for the class loss in the Fast R-CNN head, to further address class imbalance.
