_BASE_: "../../../../configs/Base-RCNN-FPN.yaml"
MODEL:
  META_ARCHITECTURE: "TailedRCNN"
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  MASK_ON: True
  RESNETS:
    DEPTH: 50
  PHYSICS_FAN:
    NUM_COMPONENTS: 10  # Adjust based on your component definition
    NUM_PHYSICS_FEATURES: 10  # Size of physics feature vector
    EMBEDDING_DIM: 128  # Size of component embeddings
    EMBEDDING_DROPOUT: 0.0  # Dropout for MLP embeddings
    NUM_ATTENTION_HEADS: 8
    ATTENTION_DROPOUT: 0.0
  FUSION_MODULE:
    TYPE: "AttentionFusionModule" # Either this or "Concatenation"
    DROPOUT: 0.0
    NUM_HEADS: 8
  ROI_ALIGN:
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    POOLER_RESOLUTION: 28 # Increase from default 14 to 28 for better spatial detail
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"  # Use ROIAlignV2 for better performance with small objects
  VALIDITY_HEAD:
    LOSS_WEIGHT: 1.0  # Weight for the validity classification loss
    HIDDEN_DIM: 256  # Hidden dimension for the validity head MLP
  MEMBERSHIP_HEAD:
    LOSS_WEIGHT: 1.0  # Weight for the membership classification loss
    HIDDEN_DIM: 256  # Hidden dimension for the membership head MLP
DATASETS:
  TRAIN: ("b2s_",)
  TEST: ("b2s_",)
  PRECOMPUTED_PROPOSAL_TOPK_TRAIN: 10000
  PRECOMPUTED_PROPOSAL_TOPK_TEST: 10000
TRAINER:
  NAME: "B2STrainer"
DATALOADER:
  NUM_WORKERS: 4  # Adjust based on your CPU cores
SOLVER:
  IMS_PER_BATCH: 1  # Adjust based on your GPU memory
  BASE_LR: 0.001
  STEPS: (46800, 62400, 112000)  # Adjust based on your dataset size and desired schedule
  MAX_ITER: 178000
  CHECKPOINT_PERIOD: 2500
  WARMUP_ITERS: 1000
INPUT:
  MIN_SIZE_TRAIN: (300,)  # Match your image size
  MAX_SIZE_TRAIN: 300
  MIN_SIZE_TEST: 300
  MAX_SIZE_TEST: 300
  MASK_FORMAT: "bitmask"  # Use "bitmask" for RLE format annotations
TEST:
  EVAL_PERIOD: 100  # Evaluate every 10000 iterations
OUTPUT_DIR: "/home/s4861264/detectron2/projects/LoTSS-GRG-detect/output/grg_mask_rcnn_improved_3to1"
